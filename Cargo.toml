[package]
name = "cache-action"
version = "0.0.19"
edition = "2024"

[features]
sub60-cache = []

[dependencies]
async-compat = "0.2"
async-compression = { version = "0.4", features = ["futures-io", "zstd"] }
bytes = "1"
cauchy = { git = "https://github.com/nomad/cauchy.git" }
clap = { version = "4.5.38", features = ["derive"] }
derive_more = { version = "2", default-features = false, features = [
  "display",
] }
either = "1"
flume = { version = "0.12" }
futures = { version = "0.3" }
http = "1"
memchr = "2"
nix-compat = { git = "https://git.snix.dev/snix/snix", default-features = false, features = [
  "async",
  "wire",
] }
nix-types = { git = "https://github.com/sub60/cache.git" }
nixb = { git = "https://github.com/noib3/nixb", branch = "store-path-info", features = [
  "nix-2-35",
  "store",
] }
pin-project-lite = "0.2"
reqwest = "0.13"
sha2 = "0.11"
smallvec = "1"
smol_str = "0.3.6"
sub60-cache = { git = "https://github.com/sub60/cache.git" }
tempfile = "3"
tokio = { version = "1", default-features = false, features = [
  "fs",
  "io-std",
  "io-util",
  "net",
  "rt-multi-thread",
  "time",
] }
url = "2"

[build-dependencies]
pkg-config = "0.3"

[lints.rust]
refining_impl_trait = { level = "allow", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
