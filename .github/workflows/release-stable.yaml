name: Publish a stable release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build for ${{ matrix.package }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # - package: aarch64-linux
          #   runner: ubuntu-latest
          - package: x86_64-linux
            runner: ubuntu-latest
          # - package: aarch64-darwin
          #   runner: macos-14
          # - package: x86_64-darwin
          #   runner: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Build package
        run: nix build ".#${{ matrix.package }}"

      - name: Stage artifact
        run: |
          cp result/bin/cache-action "cache-action-${{ matrix.package }}"
          gzip -9n "cache-action-${{ matrix.package }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cache-action-${{ matrix.package }}.gz
          path: cache-action-${{ matrix.package }}.gz
          if-no-files-found: error

  release-stable:
    name: Publish stable release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cache-action-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command=create

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            command=edit
          fi

          args=(
            "$RELEASE_TAG"
            --title "$RELEASE_TAG"
            --notes ""
          )

          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi

          gh release "$command" --repo "$GITHUB_REPOSITORY" "${args[@]}"

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
