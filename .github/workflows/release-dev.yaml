name: Publish a pre-release

on:
  push:
    branches:
      - main

concurrency:
  group: release-pre-release
  # Do not cancel a run after it may have begun replacing release assets.
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check for a version tag
    runs-on: ubuntu-latest
    outputs:
      is_tagged: ${{ steps.check.outputs.is_tagged }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check
        name: Detect version tag
        run: |
          is_tagged=false

          if [[ -n "$(git tag --points-at "$GITHUB_SHA" --list 'v*')" ]]; then
            is_tagged=true
            echo "$GITHUB_SHA has a version tag; the stable workflow will publish it"
          fi

          echo "is_tagged=$is_tagged" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.package }}
    needs: check-tag
    if: needs.check-tag.outputs.is_tagged == 'false'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # - package: aarch64-linux
          #   runner: ubuntu-latest
          - package: x86_64-linux
            runner: ubuntu-latest
          # - package: aarch64-darwin
          #   runner: macos-14
          # - package: x86_64-darwin
          #   runner: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Build package
        run: nix build ".#${{ matrix.package }}"

      - name: Stage artifact
        run: |
          cp result/bin/cache-action "cache-action-${{ matrix.package }}"
          gzip -9n "cache-action-${{ matrix.package }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cache-action-${{ matrix.package }}.gz
          path: cache-action-${{ matrix.package }}.gz
          if-no-files-found: error

  release-dev:
    name: Publish pre-release
    needs:
      - check-tag
      - build
    if: needs.check-tag.outputs.is_tagged == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: pre-release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cache-action-*
          path: dist
          merge-multiple: true

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              --raw-field sha="$GITHUB_SHA" \
              --field force=true \
              --silent
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              --raw-field ref="refs/tags/$RELEASE_TAG" \
              --raw-field sha="$GITHUB_SHA" \
              --silent
          fi

          command=create

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            command=edit
          fi

          gh release "$command" "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "Pre-release for commit $GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --verify-tag

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
