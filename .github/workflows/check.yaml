name: check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: NixOS/nix-installer-action@main
      - name: Setup SSH keys for private flake inputs
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.NOIB3_NIX_JETTISON_SSH_KEY }}
      - name: Setup Nix cache
        uses: sub60/setup-cache@main
      - name: Check Clippy
        run: nix run --accept-flake-config .#check-clippy

  formatting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: NixOS/nix-installer-action@main
      - name: Setup Nix cache
        uses: sub60/setup-cache@main
      - name: Check formatting
        run: nix run --accept-flake-config .#check-formatting
