name: "sub60's cache action"

description: "Sets up and drains the sub60 Nix cache uploader"

inputs:
  namespace:
    description: "The sub60 namespace containing the cache"
    required: false
    default: ${{ github.repository_owner }}
  cache:
    description: "The sub60 cache name"
    required: false
    default: ${{ github.event.repository.name }}
  auth-token:
    description: "The authentication token used to push store paths"
    required: true
  upstream-caches:
    description: "Space/newline-separated binary cache URLs whose store paths should not be pushed. Use 'none' to disable"
    required: false
    default: "https://cache.nixos.org"
  github-token:
    description: "GitHub token used to download release artifacts from private repos"
    required: false
  release-repository:
    description: "Repository containing setup-cache release artifacts"
    required: false
  action-ref:
    description: "The setup-cache release tag to download when using a vendored checkout"
    required: false

runs:
  using: "node24"
  main: "js/main.js"
  post: "js/post.js"
  post-if: "always() && env.SUB60_SETUP_CACHE_STARTED == 'true'"
