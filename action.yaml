name: "sub60's cache action"

description: "Sets up and drains the sub60 Nix cache uploader"

inputs:
  account:
    description: "The sub60 account that owns the cache"
    required: false
    default: ${{ github.repository_owner }}
  cache:
    description: "The name of the cache in the selected account"
    required: false
    default: ${{ github.event.repository.name }}
  token:
    description: "The token used to push store paths. If unset, the job's GitHub Actions OIDC token is exchanged for one, which needs the job to have the `id-token: write` permission"
    required: false
  upstream-caches:
    description: "Space/newline-separated binary cache URLs whose store paths should not be pushed. If unset, they're the HTTP(S) substituters Nix builds with, including those from a flake's nixConfig (except the cache itself, of course). Use 'none' to push every store path"
    required: false
  github-token:
    description: "The token authenticating requests to GitHub's API"
    required: false
    default: ${{ github.token }}
  release-repository:
    description: "Repository containing setup-cache release artifacts"
    required: false
  action-ref:
    description: "The setup-cache release tag to download when using a vendored checkout"
    required: false

runs:
  using: "node24"
  main: "js/main.js"
  post: "js/post.js"
  post-if: "always() && env.SUB60_SETUP_CACHE_STARTED == 'true'"
